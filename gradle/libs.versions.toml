[versions]
agp = "8.12.3"
kotlin = "2.0.10"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.12.1"
composeBom = "2025.12.00"
daggerHilt = "2.57.2"
daggerHiltComposeNavigation = "1.3.0"
roomDatabase = "2.8.4"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }



# Dagger Hilt
dagger-hilt = { module = "com.google.dagger:hilt-android", version.ref = "daggerHilt" }
dagger-ksp = { module = "com.google.dagger:hilt-android-compiler", version.ref = "daggerHilt" }
hilt-compose-navigation = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "daggerHiltComposeNavigation" }


# Room Database
room = { module = "androidx.room:room-runtime", version.ref = "roomDatabase" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "roomDatabase" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "roomDatabase" }

# Retrofit
retrofit = { module = "com.squareup.retrofit2:retrofit", version = "3.0.0" }
retrofit-gson-convertor = { module = "com.squareup.retrofit2:converter-gson", version = "3.0.0" }

# TEST IMPLEMENTAIONS
testImpl-mock-server = { module = "com.squareup.okhttp3:mockwebserver", version = "4.12.0" }
testImpl-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version = "1.9.0" }
testImpl-mockk = { module = "io.mockk:mockk", version = "1.14.6" }
testImpl-mockk-android = { module = "io.mockk:mockk-android", version = "1.14.6" }
testImpl-mockk-agent = { module = "io.mockk:mockk-agent", version = "1.14.6" }
testImpl-androidx-arch-core = { module = "androidx.arch.core:core-testing", version = "2.2.0" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

